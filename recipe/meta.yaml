{% set name = "plot_map" %}
{% set version = "0.3.7" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/plot_map-{{ version }}.tar.gz
  sha256: ecf7fbc534a044b9d6f13c12455c155164bb0c1525e765e18352f4e880d08187
  
build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - geopandas
    - matplotlib-base
    - numpy
    - shapely
    - python >={{ python_min }}

test:
  imports:
    - plot_map
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ni1o1/plot_map
  summary: A tool to add basemap in matplotlib
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ni1o1
